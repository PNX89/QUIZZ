[project]
name = "quizz"
version = "0.1.0"
description = "An as-of question answering agent, scored on right answers and on correct refusals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quelin Zammit" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Empty on purpose at the scaffold, and it is a decision rather than an omission. A
# dependency arrives in the commit that first imports it, so the history shows what each
# one was bought for. The services this repository talks to run in containers and are
# described in compose.yaml; talking to them needs client libraries, and those land with
# the code that talks.
# The MCP SDK is a RUNTIME dependency, not a development one: the tool surface is a thing a
# reader is meant to run against their own client, and a server whose transport only exists in
# the test environment is a server nobody can use.
dependencies = [
    "langgraph>=0.2",
    "mcp>=2.0.0,<3",
]

# `live` is the only way to reach the network, and it is an EXTRA rather than a dependency so
# that a reader who wants to run the demonstration and the tests never installs it and never
# needs a key. Recording cassettes is a deliberate, paid, one-time act.
[project.optional-dependencies]
live = ["anthropic>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/PNX89/QUIZZ"
Source = "https://github.com/PNX89/QUIZZ"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyYAML is a test dependency and only a test dependency. tests/test_services.py reads
# compose.yaml and compares it against the defaults in src/quizz/services.py, and parsing
# YAML with a regular expression is how the portfolio's map generator once read the word
# "error" out of a prose comment.
# `capture` is deliberately NOT in `dev`. scripts/capture_vintages.py is the only code here
# that reaches the network, it is run by hand rather than by CI, and openpyxl exists in this
# repository to read one publisher's spreadsheets. Nothing in the test suite imports it.
[dependency-groups]
capture = ["openpyxl>=3.1"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML>=6",
    # Only the services suite imports this. It is in `dev` rather than its own group so that
    # the type checker sees the same tree everywhere: a module CI cannot import is a module CI
    # cannot check.
    "psycopg[binary]>=3.2",
    "redis>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quizz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The services suite is DESELECTED here rather than skipped. A skipped test reports as a pass
# and nobody looks; a deselected marker is visibly absent from the count, and the containers job
# in ci.yml runs exactly this marker with a real pgvector service behind it.
addopts = "-q -m 'not services'"
markers = [
    "services: needs the containers compose.yaml brings up. Run with -m services.",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true
