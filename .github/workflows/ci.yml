name: CI

# Nothing here reaches the network and nothing here needs a key. The two services in
# compose.yaml are for local work; no test in this job talks to either one, because a test
# that quietly requires a container is a test that fails for a stranger and passes here.
#
# The shared legs, lint, format, types and the suite, live in PNX89/.github and are pinned
# to a tag rather than a branch, so a commit in that repository cannot turn this badge red.
# What the pipeline is for, and the five things it deliberately does not gate, is argued at
# https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The retrieval barrier is a claim about a query plan, and a query plan needs a real planner.
  # This job is here rather than in the shared workflow because a service container is an
  # argument this repository is making and not shared plumbing.
  #
  # The suite it runs is DESELECTED from the job above by its marker rather than skipped inside
  # it, so those tests are visibly absent from that count and visibly present in this one. A
  # skipped test reports as a pass and nobody reads it.
  containers:
    name: the barrier and the bucket against real services
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: quizz
          POSTGRES_PASSWORD: quizz
          POSTGRES_DB: quizz
        # 5433 on the host for the same reason compose.yaml uses it: one above the standard, so
        # nothing on a runner or a laptop can already hold the port.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quizz -d quizz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -m services -q
